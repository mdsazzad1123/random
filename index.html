<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Digit Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-5 max-w-md mx-auto">

    <!-- Top Navigation / Header -->
    <header class="flex items-center justify-between py-3 border-b border-gray-200">
        <h1 class="text-lg font-bold tracking-tight text-black">Number Generator</h1>
        <button onclick="toggleHistory(true)" class="text-sm font-medium text-black border border-black px-3 py-1.5 rounded-md hover:bg-black hover:text-white transition-colors flex items-center gap-2">
            <i class="fa-solid fa-clock-rotate-left text-xs"></i>
            <span>History (<span id="historyCount">0</span>)</span>
        </button>
    </header>

    <!-- Main Active Display Area -->
    <main class="my-auto py-12 flex flex-col items-center justify-center text-center">
        <!-- Number Display -->
        <div id="numberContainer" class="min-h-[90px] flex items-center justify-center w-full my-4">
            <span id="activeNumber" class="font-mono text-3xl sm:text-4xl font-extrabold tracking-widest text-black">
                ----------
            </span>
        </div>

        <!-- Action Controls -->
        <div class="flex flex-col sm:flex-row gap-3 w-full mt-4">
            <button id="generateBtn" onclick="generateSingleNumber()" class="w-full bg-black hover:bg-gray-800 active:scale-95 text-white font-medium py-3.5 px-6 rounded-lg transition-all text-base">
                Generate Number
            </button>
            
            <button id="copyBtn" onclick="copyActiveNumber()" disabled class="w-full bg-white hover:bg-gray-100 disabled:opacity-40 disabled:hover:bg-white text-black font-medium border border-black py-3.5 px-6 rounded-lg transition-all text-base flex items-center justify-center gap-2">
                <i class="fa-regular fa-copy"></i>
                <span id="copyBtnText">Copy</span>
            </button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-gray-400 py-4 border-t border-gray-100">
        100% Unique 10-Digit Random Generator
    </footer>

    <!-- History Hidden Modal/Panel -->
    <div id="historyModal" class="fixed inset-0 bg-white z-50 p-5 flex flex-col hidden">
        <!-- History Header -->
        <div class="flex items-center justify-between py-3 border-b border-gray-200 mb-4">
            <div class="flex items-center gap-2">
                <h2 class="text-lg font-bold text-black">Generated History</h2>
            </div>
            <button onclick="toggleHistory(false)" class="text-black p-2 text-lg hover:bg-gray-100 rounded-md">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- History Items List -->
        <div id="historyList" class="flex-grow overflow-y-auto space-y-2 pr-1">
            <!-- Empty State -->
            <div id="historyEmpty" class="text-center py-20 text-gray-400">
                <p class="text-sm">No history available yet.</p>
            </div>
        </div>

        <!-- History Footer Actions -->
        <div class="pt-4 border-t border-gray-200 mt-2 flex gap-3">
            <button onclick="clearHistory()" class="w-full border border-red-600 text-red-600 hover:bg-red-50 font-medium py-2.5 rounded-lg text-sm transition-colors">
                Clear History
            </button>
            <button onclick="toggleHistory(false)" class="w-full bg-black text-white font-medium py-2.5 rounded-lg text-sm">
                Close
            </button>
        </div>
    </div>

    <!-- Toast Feedback -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-black text-white text-xs px-4 py-2 rounded-md opacity-0 pointer-events-none transition-opacity duration-300 z-50">
        <span id="toastMsg">Copied to clipboard</span>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const generatedSet = new Set();
        const historyArray = [];
        let currentActiveNum = null;

        const activeNumberEl = document.getElementById('activeNumber');
        const copyBtn = document.getElementById('copyBtn');
        const copyBtnText = document.getElementById('copyBtnText');
        const historyCountEl = document.getElementById('historyCount');
        const historyModal = document.getElementById('historyModal');
        const historyList = document.getElementById('historyList');
        const historyEmpty = document.getElementById('historyEmpty');
        const toastEl = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // Function to generate unique 10-digit number
        function generateUniqueNumber() {
            if (generatedSet.size >= 9000000000) {
                showToast("All possible numbers generated!");
                return null;
            }

            let numStr;
            do {
                const firstDigit = Math.floor(Math.random() * 9) + 1;
                let rest = '';
                for (let i = 0; i < 9; i++) {
                    rest += Math.floor(Math.random() * 10);
                }
                numStr = `${firstDigit}${rest}`;
            } while (generatedSet.has(numStr));

            generatedSet.add(numStr);
            return numStr;
        }

        // Generate button handler
        function generateSingleNumber() {
            const newNum = generateUniqueNumber();
            if (!newNum) return;

            // Replace active number (previous number is hidden)
            currentActiveNum = newNum;
            activeNumberEl.innerText = newNum;
            copyBtn.disabled = false;

            // Reset copy button state text
            copyBtnText.innerText = "Copy";

            // Push to history
            historyArray.unshift(newNum);
            updateHistoryUI();
        }

        // Copy active number
        function copyActiveNumber() {
            if (!currentActiveNum) return;
            copyToClipboard(currentActiveNum);
            copyBtnText.innerText = "Copied!";
            setTimeout(() => {
                copyBtnText.innerText = "Copy";
            }, 2000);
        }

        // Copy Helper
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();

            try {
                document.execCommand('copy');
                showToast("Copied: " + text);
            } catch (err) {
                showToast("Failed to copy");
            } finally {
                document.body.removeChild(textarea);
            }
        }

        // Toggle History View
        function toggleHistory(show) {
            if (show) {
                historyModal.classList.remove('hidden');
            } else {
                historyModal.classList.add('hidden');
            }
        }

        // Update History UI
        function updateHistoryUI() {
            historyCountEl.innerText = historyArray.length;

            if (historyArray.length === 0) {
                historyList.innerHTML = '';
                historyList.appendChild(historyEmpty);
                historyEmpty.style.display = 'block';
                return;
            }

            historyEmpty.style.display = 'none';
            historyList.innerHTML = '';

            historyArray.forEach((num, index) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between p-3 border border-gray-200 rounded-lg text-sm bg-white";
                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-400 font-mono">#${historyArray.length - index}</span>
                        <span class="font-mono font-bold text-black tracking-wide">${num}</span>
                    </div>
                    <button onclick="copyToClipboard('${num}')" class="text-xs border border-black text-black px-2.5 py-1 rounded hover:bg-black hover:text-white transition-colors">
                        Copy
                    </button>
                `;
                historyList.appendChild(item);
            });
        }

        // Clear History
        function clearHistory() {
            if (historyArray.length === 0) return;
            historyArray.length = 0;
            updateHistoryUI();
            showToast("History cleared");
        }

        // Toast feedback message
        function showToast(msg) {
            toastMsg.innerText = msg;
            toastEl.classList.remove('opacity-0', 'pointer-events-none');
            toastEl.classList.add('opacity-100');

            setTimeout(() => {
                toastEl.classList.remove('opacity-100');
                toastEl.classList.add('opacity-0', 'pointer-events-none');
            }, 2000);
        }
    </script>
</body>
</html>
